# 쏙(SSOK) 소개·미리보기·설명서 정적 사이트 (Cloudflare Worker + static assets)
# 주소는 workers.dev(이름 없는 주소, PM 2026-11-03: 공모전 "공유 링크에 개발자 실명이 노출되지 않도록"). 예전 사용자 도메인 route 는 뺐다.
name = "ssok"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true


[assets]
directory = "./site"
binding = "ASSETS"
not_found_handling = "404-page"
