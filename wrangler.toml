# 쏙(SSOK) 소개·미리보기·설명서 정적 사이트 — ssok.hojun.app (Cloudflare Worker + static assets)
# routes 는 [assets] 절보다 위에 둔다 — 아래에 두면 TOML 규칙상 assets.routes 가 되어 도메인이 안 붙는다.
name = "ssok"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false

routes = [
  { pattern = "ssok.hojun.app", custom_domain = true }
]

[assets]
directory = "./site"
binding = "ASSETS"
not_found_handling = "404-page"
